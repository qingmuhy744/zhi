name: Android dependency graph

on:
  push:
    branches: [main, init]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: Submit Android dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: android
          additional-arguments: --no-daemon --no-configuration-cache
          dependency-graph: generate-submit-and-upload
          artifact-retention-days: 14
