name: CI

on:
  push:
    branches: [main, init]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-apk:
        description: Upload the CI release APK as an Actions artifact
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Build Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test and build Go Server
        run: |
          cd server
          go test ./...
          go build -v -o zhi-server .

  image:
    name: Build Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image with cached dependency layers
        uses: docker/build-push-action@v7
        with:
          context: server
          push: false
          tags: zhi-server:ci
          cache-from: type=gha,scope=zhi-server
          cache-to: type=gha,mode=max,scope=zhi-server

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: android
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build Android release APK
        env:
          # Same empty signing variables the release job injects when no keystore secret exists.
          ANDROID_KEYSTORE_PASSWORD: ""
          ANDROID_KEY_ALIAS: ""
          ANDROID_KEY_PASSWORD: ""
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ inputs.upload-apk != false }}
        uses: actions/upload-artifact@v7
        with:
          name: zhi-app-release
          path: android/app/build/outputs/apk/release/*.apk
