name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify Tests & Workflows
    uses: ./.github/workflows/ci.yml

  build-server:
    name: Build Multi-arch Server Binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: server/go.sum

      - name: Build Server Binaries
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64/zhi-server-linux-amd64"
            "linux/arm64/zhi-server-linux-arm64"
            "darwin/amd64/zhi-server-darwin-amd64"
            "darwin/arm64/zhi-server-darwin-arm64"
            "windows/amd64/zhi-server-windows-amd64.exe"
          )
          for p in "${platforms[@]}"; do
            IFS="/" read -r os arch output <<< "$p"
            echo "Building $output for $os/$arch..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -C server -ldflags="-s -w -X main.version=${RELEASE_TAG}" -o "../dist/$output" .
          done

      - name: Upload server artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-binaries
          path: dist/*
          retention-days: 7

  build-android:
    name: Build Signed Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK with Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          mkdir -p artifacts/android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release keystore secret detected. Decrypting into temporary memory storage..."
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/zhi-release.jks"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"):
              if not os.environ.get(name):
                  raise SystemExit(f"Missing signing secret: {name}")
          path = Path(os.environ["ANDROID_KEYSTORE_PATH"])
          path.touch(mode=0o600, exist_ok=False)
          path.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          PY
            cd android
            ./gradlew assembleRelease --no-daemon
            cd ..
            cp android/app/build/outputs/apk/release/*.apk artifacts/android/
            if [ -n "$ANDROID_SIGNING_CERT_SHA256" ]; then
              ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/android/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
              test "$ACTUAL" = "$ANDROID_SIGNING_CERT_SHA256"
              printf '%s\n' "$ACTUAL" > artifacts/android/android-signing-certificate.sha256
            fi
          else
            echo "No release keystore secret configured. Falling back to assembleDebug..."
            cd android
            ./gradlew assembleDebug --no-daemon
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/zhi-app-debug.apk
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: artifacts/android/*
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-server, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Zhi (知 / 吱) ${RELEASE_TAG}"
          NOTES="## Zhi (知 / 吱) ${RELEASE_TAG} 🎉
          
          轻量极简、纯粹克制的 Android Bark 兼容通知接收与推送工具。

          ### 📦 下载与安装
          - Android 客户端：\`app-release.apk\` / \`zhi-app-debug.apk\`
          - 服务端静态独立二进制（纯 Go 无 CGO 依赖）：
            - Linux (x86_64): \`zhi-server-linux-amd64\`
            - Linux (ARM64): \`zhi-server-linux-arm64\`
            - macOS (Intel): \`zhi-server-darwin-amd64\`
            - macOS (Apple Silicon): \`zhi-server-darwin-arm64\`
            - Windows (x86_64): \`zhi-server-windows-amd64.exe\`
          
          详见项目 [README.md](https://github.com/${{ github.repository }})."

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            PRERELEASE=()
            if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" "${PRERELEASE[@]}"
          fi
